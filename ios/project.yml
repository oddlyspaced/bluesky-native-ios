name: BlueskyNative
options:
  bundleIdPrefix: io.nativestarter.showcase
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NativeShowcase:
    type: application
    platform: iOS
    sources:
      - path: BlueskyNative
    info:
      # Generated by xcodegen from these properties; project.yml is the only source.
      path: BlueskyNative/Info.plist
      properties:
        CFBundleDisplayName: Native showcase
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UIAppFonts:
          - InterVariable.ttf
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The dev network runs on localhost. Release is a smoke build, not for store submission.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: NativeShowcase
        PRODUCT_MODULE_NAME: NativeShowcase
        PRODUCT_BUNDLE_IDENTIFIER: io.nativestarter.showcase.bluesky
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # E2E compiles in the RN TestCtrls port (debug sign-in) and the parity debug controls.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG E2E
  NativeShowcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlueskyNativeTests
    dependencies:
      - target: NativeShowcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nativestarter.showcase.bluesky.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NativeShowcase.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NativeShowcase"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NativeShowcase:
    build:
      targets:
        NativeShowcase: all
        NativeShowcaseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NativeShowcaseTests
    archive:
      config: Release
