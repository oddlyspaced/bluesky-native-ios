name: BlueskyNative
options:
  bundleIdPrefix: xyz.blueskyweb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BlueskyNative:
    type: application
    platform: iOS
    sources:
      - path: BlueskyNative
    info:
      path: BlueskyNative/Info.plist
      properties:
        CFBundleDisplayName: Bluesky native showcase
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - InterVariable.ttf
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.blueskyweb.app.native
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG E2E
  BlueskyNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlueskyNativeTests
    dependencies:
      - target: BlueskyNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.blueskyweb.app.native.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BlueskyNative.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BlueskyNative"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BlueskyNative:
    build:
      targets:
        BlueskyNative: all
        BlueskyNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BlueskyNativeTests
