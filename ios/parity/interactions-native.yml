appId: xyz.blueskyweb.app.native
---
# Drives the in-scope interactions against the live dev server:
# like, repost (confirm menu), open thread, back, undo repost, unlike.
# The first feed item is Bob's "Thread root". Check the server state with the
# curl commands in ios/README.md after the "liked" screenshot.
- runScript:
    file: setupServer.js
    env:
      SERVER_PATH: "?users&follows&posts&feeds&thread"
- runFlow:
    file: setupApp.yml
- tapOn:
    id: "e2eSignInAlice"
- extendedWaitUntil:
    visible:
      id: "feedItem-by-alice.test"
    timeout: 60000

# Like and repost the first post.
- tapOn:
    id: "likeBtn"
    index: 0
- tapOn:
    id: "repostBtn"
    index: 0
- tapOn: "Repost"
- waitForAnimationToEnd
- takeScreenshot: shots/interactions-liked-reposted

# The thread shows the same state (shared post shadow).
- tapOn: "Thread root"
- extendedWaitUntil:
    visible: "Thread reply"
    timeout: 20000
- takeScreenshot: shots/interactions-thread
- back

# Undo: the menu now offers "Remove repost".
- tapOn:
    id: "repostBtn"
    index: 0
- assertVisible: "Remove repost"
- tapOn: "Remove repost"
- tapOn:
    id: "likeBtn"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: shots/interactions-undone
