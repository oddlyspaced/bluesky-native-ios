# Capture of the three slice screens: home, thread, profile. One flow for both builds.
# Run it through ../run-capture.sh or ../run-pair.sh, which call check-parity/scripts/capture.mjs.
#
# Variables (all passed with capture.mjs --env; none has a flow-header default):
#   LABEL   rn | native (capture.mjs --label)
#   SEED    seed query; default the standard seed "?users&follows&posts&feeds&thread"
#   SUFFIX  screenshot name suffix, for example -dark
#   RESEED  "false" skips the seed step, so the second app of a pair sees the same posts and
#           timestamps as the first (the anchor date line then needs no mask)
# Maestro 2.4.0 lets a flow-header `env:` block override `-e` values, so defaults are computed
# with evalScript.
appId: io.nativestarter.showcase.bluesky
---
- evalScript: "${output.seed = (typeof SEED === 'undefined' ? '?users&follows&posts&feeds&thread' : SEED)}"
- evalScript: "${output.suffix = (typeof SUFFIX === 'undefined' ? '' : SUFFIX)}"
- evalScript: "${output.reseed = (typeof RESEED === 'undefined' || RESEED !== 'false')}"
- evalScript: "${output.full = (output.seed === '?users&follows&posts&feeds&thread')}"
- runFlow:
    when:
      true: ${output.reseed}
    commands:
      - runScript:
          file: setupServer.js
          env:
            SERVER_PATH: ${output.seed}
- runFlow:
    file: launch.yml
# The 1pt test control can be tapped before the app is ready; retry until the signed-out
# screen is gone. A second tap runs only when the first did not sign in.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "e2eSignInAlice"
      - extendedWaitUntil:
          notVisible: "Create account"
          timeout: 30000

# Home: wait for a real feed item (standard seed) or the end-of-feed block (empty seed).
- runFlow:
    when:
      true: ${output.full}
    commands:
      - extendedWaitUntil:
          visible:
            id: "feedItem-by-alice.test"
          timeout: 60000
- runFlow:
    when:
      true: ${!output.full}
    commands:
      - extendedWaitUntil:
          visible: "Find accounts to follow"
          timeout: 60000
# The RN screen ids of the Home stack (review findings F2, A64). These assert only; they change
# nothing that is captured and no screen order. Without them, deleting an id fails no check.
- assertVisible:
    id: "HomeScreen"
- assertVisible:
    id: "homeScreen"
- assertVisible:
    id: "followingFeedPage"
- waitForAnimationToEnd
- takeScreenshot: home${output.suffix}

# Thread (standard seed only), then back with the edge swipe of the native stack (review
# finding N16). Maestro `back` does nothing on iOS, so the swipe is the only way back here.
- runFlow:
    when:
      true: ${output.full}
    commands:
      - tapOn: "Thread root"
      - extendedWaitUntil:
          visible: "Thread reply"
          timeout: 20000
      - waitForAnimationToEnd
      - takeScreenshot: thread${output.suffix}
      - swipe:
          start: "1%, 45%"
          end: "90%, 45%"
          duration: 400
      # Swipe back is a functional check, and the two builds do not agree on it.
      #
      # React Native pops here. The port does not: measured 2026-10-22, the stack's two pop gestures
      # are installed and enabled and the stack is two deep, but `gestureRecognizerShouldBegin` is
      # never called, so the recognizer never attempts the gesture. `ios/PARITY.md` already recorded
      # that the A63 re-implementation had never been exercised by a real swipe and that this flow
      # had to run again before swipe back could be claimed. It has now run. See the open defect in
      # `ios/PARITY.md`, "Swipe back does not pop".
      #
      # The check is kept, and it is kept optional, so the difference is visible in the flow output
      # without costing the three screenshots this state exists to produce. `profile` is reached
      # through the bottom bar below, which is on screen in both builds whether or not the stack
      # popped, so the screenshot is the same picture either way.
      # "Thread reply" is also a Home feed row, so the check uses the thread-only reply prompt.
      - extendedWaitUntil:
          notVisible: "Write your reply"
          timeout: 10000
          optional: true
      - assertVisible:
          id: "feedItem-by-alice.test"
          optional: true
      - waitForAnimationToEnd

# Profile.
- tapOn:
    id: "bottomBarProfileBtn"
- extendedWaitUntil:
    visible:
      id: "profileView"
    timeout: 20000
# The RN screen ids of the Profile stack (review findings F2, A64). Assertions only.
- assertVisible:
    id: "profileScreen"
- assertVisible:
    id: "postsFeed"
- waitForAnimationToEnd
- takeScreenshot: profile${output.suffix}
