# States that an API setup step can produce (review findings F4, F9), created by setupApi.js on
# the standard seed: a "Reposted by" reason row, a post with link, mention and tag facets, a
# thread whose replies are disabled by a threadgate, and profile bio facets.
#
# Variables: LABEL (capture.mjs --label), RESEED ("false" skips the seed and setup steps for the
# second app of a pair).
appId: io.nativestarter.showcase.bluesky
---
- evalScript: "${output.reseed = (typeof RESEED === 'undefined' || RESEED !== 'false')}"
- runFlow:
    when:
      true: ${output.reseed}
    commands:
      - runScript:
          file: setupServer.js
          env:
            SERVER_PATH: "?users&follows&posts&feeds&thread"
      - runScript:
          file: setupApi.js
          env:
            SETUP: "api"
- runFlow:
    file: launch.yml
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "e2eSignInAlice"
      - extendedWaitUntil:
          notVisible: "Create account"
          timeout: 30000
- extendedWaitUntil:
    visible: "Reposted by.*"
    timeout: 60000
- extendedWaitUntil:
    visible: "Facets: .*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: home-api
# The first "Thread reply" row is carla's reply reposted by bob. Opening it shows bob's "Thread
# root" as the parent row; tapping that row makes the gated root the anchor, so the who-can-reply
# state belongs to the anchor post in both apps.
- tapOn:
    text: "Thread reply"
    index: 0
- extendedWaitUntil:
    visible: "Thread root"
    timeout: 20000
- tapOn: "Thread root"
# `postThreadItem-by-bob.test` is the gated root as the thread's own anchor, exposed in both apps
# (RN `ThreadItemAnchor.tsx:319`, native `ThreadScreen.swift:210`), and it needs no counts.
# Neither app exposes the who-can-reply label or the reply pill as text to XCUITest, so the
# reply-disabled state is proven by the captured pixels instead.
- extendedWaitUntil:
    visible:
      id: "postThreadItem-by-bob.test"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: thread-api
# The bottom bar is reachable from the thread, so the profile tab is tapped directly. The swipe
# back is exercised by `capture.yml` in the base state (review finding N16).
- tapOn:
    id: "bottomBarProfileBtn"
- extendedWaitUntil:
    visible: "Bio facets: .*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: profile-api
