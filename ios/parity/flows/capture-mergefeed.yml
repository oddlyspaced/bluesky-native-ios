# Home with the upstream `mergefeed` seed (review finding N13): bob and carla (followed by alice)
# with 20 posts each, self replies and replies to other users, so the first screen shows
# "Replied to" rows and thread lines that the standard seed does not have.
#
# Variables: LABEL (capture.mjs --label), RESEED ("false" skips the seed step for the second app).
appId: io.nativestarter.showcase.bluesky
---
- evalScript: "${output.reseed = (typeof RESEED === 'undefined' || RESEED !== 'false')}"
- runFlow:
    when:
      true: ${output.reseed}
    commands:
      - runScript:
          file: setupServer.js
          env:
            SERVER_PATH: "?mergefeed"
- runFlow:
    file: launch.yml
# The 1pt test control can be tapped before the app is ready; retry until the signed-out
# screen is gone. A second tap runs only when the first did not sign in.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "e2eSignInAlice"
      - extendedWaitUntil:
          notVisible: "Create account"
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: "feedItem-by-carla.test"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: home-mergefeed
